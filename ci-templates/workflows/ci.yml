name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format + security scanning (fast, runs on 3.11)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint / Format / Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Bandit (security)
        run: bandit -c pyproject.toml -r src

      - name: pip-audit (known vulnerabilities)
        continue-on-error: true
        run: pip-audit --strict --progress-spinner off

  # ---------------------------------------------------------------------------
  # Static type checking
  # ---------------------------------------------------------------------------
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy src/formulation_workbench

  # ---------------------------------------------------------------------------
  # Unit + integration tests on a Python matrix
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -n auto --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Integration test against a real PostgreSQL — proves the driver + models
  # + migrations work end-to-end on a non-SQLite backend.
  # ---------------------------------------------------------------------------
  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: formulation
          POSTGRES_PASSWORD: formulation
          POSTGRES_DB: formulation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formulation"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Apply migrations
        env:
          FW_DATABASE_URL: postgresql+asyncpg://formulation:formulation@localhost:5432/formulation
        run: alembic upgrade head

      - name: Run migration drift-check against Postgres
        env:
          FW_DATABASE_URL: postgresql+asyncpg://formulation:formulation@localhost:5432/formulation
          FW_TEST_POSTGRES_URL: postgresql+asyncpg://formulation:formulation@localhost:5432/formulation
        run: pytest tests/integration/test_migrations_postgres.py -q --no-cov

      - name: Boot API against Postgres and hit /health
        env:
          FW_DATABASE_URL: postgresql+asyncpg://formulation:formulation@localhost:5432/formulation
          FW_ENVIRONMENT: development
          FW_LOG_JSON: "false"
        run: |
          formulation-api &
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo -e "\n✓ Postgres backend live"
              exit 0
            fi
            sleep 1
          done
          echo "✗ API did not become healthy against Postgres"
          exit 1

  # ---------------------------------------------------------------------------
  # Trivy — container image vulnerability scan (SARIF → GitHub Security tab)
  # ---------------------------------------------------------------------------
  container-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: formulation-workbench:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: formulation-workbench:scan
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"          # report only; job never blocks the build
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container

      - name: Trivy config scan (Dockerfile + K8s manifests)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Upload config SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy fail-on-critical gate
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: formulation-workbench:scan
          format: table
          exit-code: "1"          # fail the build on CRITICAL findings
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

  # ---------------------------------------------------------------------------
  # Software Bill of Materials (CycloneDX)
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project + cyclonedx-bom
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate SBOM
        run: cyclonedx-py environment --output-format json --output-file sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Docker image build (validates the Dockerfile every PR; publish in release.yml)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: formulation-workbench:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Smoke test — container starts + /health responds
        run: |
          docker run -d --name fw -p 8000:8000 \
              -e FW_ENVIRONMENT=development \
              -e FW_API_TOKEN= \
              formulation-workbench:${{ github.sha }}
          # give it up to 30s to become ready
          for i in $(seq 1 30); do
              if curl --fail --silent http://localhost:8000/health; then
                  echo -e "\n✓ /health OK"
                  exit 0
              fi
              sleep 1
          done
          echo "✗ container did not become healthy"; docker logs fw; exit 1
