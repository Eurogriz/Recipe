name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format + security scanning (fast, runs on 3.11)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint / Format / Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Bandit (security)
        run: bandit -c pyproject.toml -r src

      - name: pip-audit (known vulnerabilities)
        continue-on-error: true
        run: pip-audit --strict --progress-spinner off

  # ---------------------------------------------------------------------------
  # Static type checking
  # ---------------------------------------------------------------------------
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        continue-on-error: true  # strict mode is aspirational for beta
        run: mypy src/formulation_workbench

  # ---------------------------------------------------------------------------
  # Unit + integration tests on a Python matrix
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -n auto --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Software Bill of Materials (CycloneDX)
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project + cyclonedx-bom
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate SBOM
        run: cyclonedx-py environment --output-format json --output-file sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Docker image build (validates the Dockerfile every PR; publish in release.yml)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: formulation-workbench:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Smoke test — container starts + /health responds
        run: |
          docker run -d --name fw -p 8000:8000 \
              -e FW_ENVIRONMENT=development \
              -e FW_API_TOKEN= \
              formulation-workbench:${{ github.sha }}
          # give it up to 30s to become ready
          for i in $(seq 1 30); do
              if curl --fail --silent http://localhost:8000/health; then
                  echo -e "\n✓ /health OK"
                  exit 0
              fi
              sleep 1
          done
          echo "✗ container did not become healthy"; docker logs fw; exit 1
