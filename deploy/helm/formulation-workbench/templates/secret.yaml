{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "formulation-workbench.secretName" . }}
  labels:
    {{- include "formulation-workbench.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
