apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All manifests are labelled so that ServiceMonitors / NetworkPolicies /
# HPAs can select them consistently.
commonLabels:
  app.kubernetes.io/name: formulation-workbench
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: formulation-workbench

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - service.yaml
  - deployment.yaml
  - poddisruptionbudget.yaml
  - hpa.yaml
  - networkpolicy.yaml
