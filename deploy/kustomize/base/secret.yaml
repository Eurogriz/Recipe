apiVersion: v1
kind: Secret
metadata:
  name: formulation-workbench-secret
  namespace: formulation-workbench
type: Opaque
# Real secrets MUST be supplied by a secret manager (ExternalSecrets /
# SealedSecrets / Vault Agent).  These placeholders exist only so that
# `kubectl apply -k` succeeds in a local cluster for exploration.
stringData:
  FW_DATABASE_URL: "postgresql+asyncpg://formulation:CHANGEME@postgres:5432/formulation"
  FW_JWT_SECRET: "CHANGEME-please-generate-with-openssl-rand-hex-32"
  FW_ENCRYPTION_KEY_HEX: ""
