# Alembic configuration for Formulation Workbench
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Search path for migration files (allows nested)
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

# Max identifier length
truncate_slug_length = 40

# Set in sqlalchemy.url (DO NOT hardcode credentials here)
sqlalchemy.url = sqlite:///./formulation.db

# Tag template for revisions
revision_environment = false

# (Optional) `sourceless` flag — disable if using autogenerate
sourceless = false

# (Optional) Version path separator
version_path_separator = os

# Output encoding for migrations
output_encoding = utf-8

[post_write_hooks]
# After alembic creates a new migration, run ruff
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
