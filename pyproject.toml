[project]
name = "formulation-workbench"
version = "1.19.0"
description = "Verified formulation database and API for paints, coatings, adhesives, sealants and construction chemicals."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Formulation Workbench Team", email = "team@formulation-workbench.local"},
]
keywords = ["formulation", "paint", "coatings", "LIMS", "PLM", "chemistry", "verified-recipes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# ============================================================================
# Core (headless) dependencies — enough to run CLI, REST API, and business
# logic. Optional extras add UI, encrypted SQLCipher, or dev tooling.
# ============================================================================
dependencies = [
    # Data layer
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    # Validation & types
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    # Security
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    # Logging
    "structlog>=24.1",
    # i18n
    "Babel>=2.14",
    # Numerics
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    # Documents
    "reportlab>=4.1",
    "openpyxl>=3.1",
    "lxml>=5.1",
    "defusedxml>=0.7.1",
    # CLI + REST
    "typer>=0.12",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    # Utilities
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Advisory ML predictor — pulls sklearn/joblib
ml = [
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3",
]
# Encrypted DB via SQLCipher (requires system libsqlcipher)
sqlcipher = [
    "sqlcipher3-binary>=0.5.4; python_version < '3.13'",
]
# Optional PySide6 desktop shell (out of GA scope; kept for local exploration)
desktop = [
    "PySide6>=6.6,<7.0",
]
# PostgreSQL async driver (recommended for multi-user server deployments)
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",  # used by alembic sync flows
]
# Full JWT support (RS256/ES256, JWKS, …).  HS256 works without this extra
# thanks to the in-tree fallback but production installs should include it.
jwt = [
    "pyjwt[crypto]>=2.8",
]
# Observability / production ops
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "httpx>=0.27",              # ASGI test client for FastAPI
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.4",       # SBOM generation
    "pre-commit>=3.7",
    "pyinstaller>=6.6",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.urls]
Homepage = "https://github.com/Eurogriz/Recipe"
Documentation = "https://github.com/Eurogriz/Recipe/tree/main/docs"
Repository = "https://github.com/Eurogriz/Recipe"
Issues = "https://github.com/Eurogriz/Recipe/issues"
Changelog = "https://github.com/Eurogriz/Recipe/blob/main/CHANGELOG.md"

[project.scripts]
formulation-workbench = "formulation_workbench.presentation.cli:app"
formulation-api = "formulation_workbench.presentation.api.main:run"
formulation-init-db = "formulation_workbench.presentation.commands.init_db:main"
formulation-import-seed = "formulation_workbench.presentation.commands.import_seed:main"
formulation-export-pdf = "formulation_workbench.presentation.commands.export_pdf:main"
formulation-backup = "formulation_workbench.presentation.commands.backup:main"
formulation-production-vectors = "formulation_workbench.presentation.commands.production_vectors:main"
formulation-drift-check = "formulation_workbench.presentation.commands.drift_check:main"
formulation-admin-users = "formulation_workbench.presentation.commands.admin_users:main"
formulation-train-models = "formulation_workbench.presentation.commands.train_models:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"formulation_workbench" = ["py.typed"]

# ============================================================================
# RUFF (linter + formatter)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations/versions", "build", "dist", ".venv", "seed-data*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF",
    "PT", "TCH", "PTH", "PL", "TRY", "S",
]
ignore = [
    "E501",     # line length handled by formatter
    "PLR0913",  # too many arguments (acceptable in DTOs)
    "PLR0917",  # ditto — too many positional args
    "TRY003",   # long exception messages
    "TRY400",   # logger.exception vs .error is contextual
    "S101",     # assert usage (allowed where sensible)
    "PLR2004",  # magic values are acceptable in numeric domain code
    "S311",     # non-crypto random OK in tests/scripts
    "S104",     # binding to 0.0.0.0 is intentional in containers
    "PLC0415",  # inline imports needed to break cycles / for optional deps
    "PLW0603",  # module-level global caches are pragmatic
    "TC001",    # first-party imports don't need TYPE_CHECKING guards
    "TC002",    # third-party imports don't need TYPE_CHECKING guards
    "TC003",    # stdlib imports don't need TYPE_CHECKING guards
    "RUF001",   # cyrillic look-alikes are intentional (RU-language content)
    "RUF002",   # ditto for docstrings
    "RUF003",   # ditto for comments
    "RUF012",   # SQLAlchemy Mapped[list[…]] triggers false positives
    "PTH123",   # `open()` is fine when we don't need Path features
    "SIM102",   # nested if is sometimes clearer
    "SIM117",   # nested `with` is fine for readability
    "PT011",    # pytest.raises(Exception) is sometimes intentional
    "PLR0912",  # too many branches in state-machine code
    "PLR0915",  # too many statements in fixture/CLI code
    "PLR0911",  # too many returns in guard-heavy functions
    "TRY301",   # abstract raise into inner fn — not always beneficial
    "TRY004",   # domain code raises ValueError for invalid data intentionally
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "S105", "S106", "B008", "PLR0915", "S311", "PT012", "N806"]
"src/formulation_workbench/domain/exceptions.py" = ["N818"]
"src/formulation_workbench/domain/services/verification_rules.py" = ["N818"]
"src/formulation_workbench/domain/value_objects/verification_status.py" = ["N818"]
"src/formulation_workbench/domain/value_objects/cas_number.py" = ["N818"]
"src/formulation_workbench/domain/value_objects/citation.py" = ["N818"]
"src/formulation_workbench/domain/value_objects/isbn.py" = ["N818"]
"src/formulation_workbench/domain/value_objects/doi.py" = ["N818"]
"src/formulation_workbench/domain/value_objects/mass_percent.py" = ["N818"]
"src/formulation_workbench/domain/entities/recipe.py" = ["N818"]
"src/formulation_workbench/presentation/commands/*" = ["T201", "B008", "S105", "S106"]
"src/formulation_workbench/presentation/cli.py" = ["T201", "B008", "S105", "S106"]
"src/formulation_workbench/presentation/api/*" = ["B008"]
"src/formulation_workbench/infrastructure/integrations/*" = ["S314", "S318"]  # lxml is used with defaults; XXE mitigation in adapter
"src/formulation_workbench/infrastructure/ml/*" = ["S301", "N806", "F821", "SIM108"]
"migrations/versions/*" = ["E501", "N806"]
"scripts/*" = ["T201", "S311", "PLR"]

[tool.ruff.lint.isort]
known-first-party = ["formulation_workbench"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# MYPY (strict type checking)
# ============================================================================
[tool.mypy]
python_version = "3.10"
# Progressive strictness: the whole tree is checked, but only the modules
# listed under `[[tool.mypy.overrides]]` with `disallow_untyped_defs = true`
# are required to have full annotations.  New modules should be added to
# the strict list to prevent regressions.
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
plugins = ["pydantic.mypy"]
exclude = [
    "^src/formulation_workbench/infrastructure/ml/property_predictor\\.py$",
    "^src/formulation_workbench/infrastructure/integrations/",
    "^migrations/",
    "^scripts/",
    "^tests/",
    "^build/",
    "^dist/",
]

# Third-party libraries without published type stubs.  Kept broad enough
# that adding an unstubbed dependency doesn't immediately break CI.
[[tool.mypy.overrides]]
module = [
    "argon2.*",
    "opentelemetry.*",
    "prometheus_client.*",
    "reportlab.*",
    "scipy.*",
    "sklearn.*",
    "structlog.*",
]
ignore_missing_imports = true

# Strict modules — must be fully typed.  Add new modules here as they land.
[[tool.mypy.overrides]]
module = [
    "formulation_workbench.domain.*",
    "formulation_workbench.application.ports.*",
    "formulation_workbench.application.dto.*",
    "formulation_workbench.infrastructure.config.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# ============================================================================
# PYTEST
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/formulation_workbench",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-branch",
    "--cov-fail-under=60",
    # Qualification benchmarks are opt-in; run them explicitly with
    # ``pytest -m qualification tests/qualification`` from the docs.
    "-m",
    "not qualification",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (DB, external services)",
    "e2e: End-to-end tests (full stack)",
    "slow: Slow tests (>5s)",
    "qualification: End-to-end quality benchmark (not run by default; see pytest -m qualification)",
    "api: FastAPI HTTP tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:argon2.*",
    "ignore::PendingDeprecationWarning",
    "ignore:.*'crypt'.*:DeprecationWarning",
]

# ============================================================================
# COVERAGE
# ============================================================================
[tool.coverage.run]
branch = true
source = ["src/formulation_workbench"]
omit = [
    "src/formulation_workbench/presentation/commands/*",
    "src/formulation_workbench/presentation/api/main.py",
    "src/formulation_workbench/infrastructure/di/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
precision = 2
show_missing = true
skip_covered = false

# ============================================================================
# BANDIT (security)
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "migrations/versions", "scripts", ".venv", "build", "dist"]
# B101 assert usage; B404/B603 subprocess (only used in tooling); B104 bind to
# 0.0.0.0 (intentional for containerised deployment; validated by AppSettings);
# B105 possible hard-coded password (false positives on placeholder strings);
# B403/B301 pickle (only used to load our own trained model on the same host);
# B405 xml.etree.ElementTree (build-only; parsing routes through defusedxml).
skips = [
    "B101",   # assert usage — pytest style
    "B104",   # bind to 0.0.0.0 (intentional inside containers)
    "B105",   # possible hard-coded password (placeholder strings)
    "B301",   # pickle deserialisation of *our own* model files
    "B311",   # random for backoff jitter — not cryptography
    "B403",   # pickle import
    "B404",   # subprocess import (used by ops tooling)
    "B405",   # xml.etree import (build-only; parsing routes through defusedxml)
    "B603",   # subprocess call without shell=False (we always pass a list)
]

# ============================================================================
# PYDANTIC
# ============================================================================
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
