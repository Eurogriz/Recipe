[project]
name = "formulation-workbench"
version = "1.0.0"
description = "Enterprise desktop application for verified formulations of paints, coatings, adhesives, sealants and construction chemicals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Formulation Workbench Team", email = "team@formulation-workbench.local"},
]
keywords = ["formulation", "paint", "coatings", "LIMS", "PLM", "chemistry", "verified-recipes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # GUI
    "PySide6>=6.6,<7.0",
    # Data layer
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "sqlcipher3-binary>=0.5.4",
    "greenlet>=3.0",  # required for SQLAlchemy async
    # Validation & types
    "pydantic>=2.6,<3.0",
    # Security
    "passlib[argon2]>=1.7.4",
    "cryptography>=42.0",
    # Logging
    "structlog>=24.1",
    # i18n
    "Babel>=2.14",
    # Calculations
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    # ML (advisory)
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3",
    # Documents
    "reportlab>=4.1",
    "openpyxl>=3.1",
    "lxml>=5.1",
    # Utilities
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",  # parallel tests
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "pre-commit>=3.7",
    "pyinstaller>=6.6",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

[project.scripts]
formulation-workbench = "presentation.main:main"
formulation-import-seed = "infrastructure.scripts.import_seed:main"
formulation-init-db = "infrastructure.scripts.init_db:main"
formulation-export-pdf = "presentation.commands.export_pdf:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================================
# RUFF (linter + formatter)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions", "build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "PT",  # pytest style
    "TCH", # type-checking imports
    "PTH", # pathlib usage
    "ERA", # commented-out code
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = [
    "E501",  # line length handled by formatter
    "PLR0913",  # too many arguments (acceptable in DTOs)
    "TRY003",  # long exception messages
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "B008"]  # magic numbers, asserts OK in tests
"src/infrastructure/scripts/*" = ["T201"]  # print statements OK in CLI scripts
"migrations/versions/*" = ["E501", "N806"]  # alembic naming conventions

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "presentation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# MYPY (strict type checking)
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports_for_stubs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlcipher3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "scipy.*",
    "numpy.*",
]
ignore_missing_imports = true

# ============================================================================
# PYTEST
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-branch",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (DB, external services)",
    "e2e: End-to-end tests (full stack)",
    "slow: Slow tests (>5s)",
    "qt: Tests requiring Qt GUI",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:passlib.*",
]

# ============================================================================
# COVERAGE
# ============================================================================
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/infrastructure/scripts/*",
    "src/presentation/main.py",
    "src/infrastructure/di/container.py",  # wiring code
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
    "if PYTEST_CURRENT_TEST:",
]
precision = 2
show_missing = true
skip_covered = false

# ============================================================================
# BANDIT (security)
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "migrations/versions"]
skips = ["B101"]  # assert usage OK in tests

# ============================================================================
# PYDANTIC
# ============================================================================
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
